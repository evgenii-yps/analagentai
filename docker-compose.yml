services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agenttrade}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # DDL применяется автоматически при первой инициализации БД.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenttrade} -d ${POSTGRES_DB:-agenttrade}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 2: контейнер запускает круглосуточный сервис-коллектор.
    command: ["python", "-m", "src.main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  agents:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 3: сервис аналитических агентов (тот же образ, своя команда).
    command: ["python", "-m", "src.agents_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  decision:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 4: агрегирующий Decision Agent (тот же образ, своя команда).
    command: ["python", "-m", "src.decision_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  notify:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 5: сервис уведомлений в Telegram (тот же образ, своя команда).
    command: ["python", "-m", "src.notify_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  evaluator:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 6: сервис оценки результатов сигналов (тот же образ, своя команда).
    command: ["python", "-m", "src.evaluator_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Этап 6.4: разовый аудит доступности бирж и ликвидности пар.
  # Не поднимается автоматически (profile). Запуск одной командой:
  #   docker compose run --rm audit
  # Результат — в таблицах exchange_audit/pair_audit и в reports/ (том смонтирован).
  audit:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["audit"]
    volumes:
      - ./reports:/app/reports
    command: ["python", "-m", "scripts.exchange_audit", "--source-ip-label", "local"]

volumes:
  pg_data:
  redis_data:
