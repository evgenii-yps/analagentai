services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agenttrade}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # DDL применяется автоматически при первой инициализации БД.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Разделяемая память контейнера. По умолчанию docker даёт /dev/shm 64 МБ, и
    # этого не хватает параллельным операциям PostgreSQL: 22.08.2026 после
    # удаления 3.57 млн строк trades обычный VACUUM ANALYZE упал с
    # «could not resize shared memory segment to 67145248 bytes: No space left
    # on device». Тот же предел ждёт параллельное чтение больших таблиц —
    # например count(*) по trades в суточной сводке и в /summary бота.
    # /dev/shm — tmpfs: память расходуется только по факту использования.
    shm_size: 512mb
    # Порт публикуется ТОЛЬКО на localhost сервера (§6.3 ТЗ 6.5): наружу 5432
    # закрыт навсегда (доступ к БД — только с самого сервера / из docker-сети).
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenttrade} -d ${POSTGRES_DB:-agenttrade}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # Порт публикуется ТОЛЬКО на localhost сервера (§6.3 ТЗ 6.5): наружу 6379
    # закрыт навсегда.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 2: контейнер запускает круглосуточный сервис-коллектор.
    command: ["python", "-m", "src.main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  agents:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 3: сервис аналитических агентов (тот же образ, своя команда).
    command: ["python", "-m", "src.agents_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  decision:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 4: агрегирующий Decision Agent (тот же образ, своя команда).
    command: ["python", "-m", "src.decision_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  notify:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 5: сервис уведомлений в Telegram (тот же образ, своя команда).
    command: ["python", "-m", "src.notify_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  evaluator:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Этап 6: сервис оценки результатов сигналов (тот же образ, своя команда).
    command: ["python", "-m", "src.evaluator_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Этап 6.7: телеграм-бот только на чтение (long polling getUpdates).
  # Постоянный сервис БЕЗ profiles — поднимается обычным `docker compose up -d`.
  # Наружу порты НЕ пробрасываются (long polling работает через исходящее
  # соединение). Сокет Docker в контейнер НЕ пробрасывается (§3.4).
  bot:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    command: ["python", "-m", "src.bot_main"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Этап 6.6: разовая выгрузка сигналов в Google Таблицу и Notion.
  # profiles: ["tools"] — сервис НЕ поднимается обычным `docker compose up -d`
  # (иначе появился бы лишний постоянный контейнер). Запускается вручную/из cron:
  #   docker compose --profile tools run --rm --no-deps export
  # restart: "no" — это разовая задача, а не сервис; код возврата пробрасывается
  # наружу (cron видит 1 при ошибке выгрузки).
  export:
    build: .
    env_file: .env
    profiles: ["tools"]
    depends_on: [postgres, redis]
    command: ["python", "-m", "src.export_main"]
    restart: "no"

  # Этап 7.3: построение калибровочной кривой (разовая задача, cron 05:30 UTC).
  # Тот же профиль tools и та же причина, что у export: постоянный контейнер не
  # нужен, а сторонние пакеты (asyncpg/structlog/pydantic) есть только в образе —
  # на хост pip-пакеты не ставятся (правило D-3).
  #   docker compose --profile tools run --rm --no-deps calibration
  # Нехватка данных для кривой — код возврата 0 (штатное состояние), реальный
  # сбой — 1, и cron его увидит.
  calibration:
    build: .
    env_file: .env
    profiles: ["tools"]
    depends_on: [postgres, redis]
    command: ["python", "-m", "src.calibration_main"]
    restart: "no"

  # Этап 8.2 §7: суточный пересчёт целей по вероятности (разовая задача,
  # cron 03:40 UTC). Тот же профиль tools и та же причина, что у export и
  # calibration: постоянный контейнер не нужен, а зависимости есть только в
  # образе (правило D-3).
  #   docker compose --profile tools run --rm --no-deps risk
  # Инструмент, не прошедший предпроверку §1, кодом возврата сбоем НЕ считается:
  # он получает строку с пустой целью и причиной data_gap, остальные считаются
  # как обычно (частичный запуск разрешён §1 ТЗ). Код 1 — только реальный сбой.
  #
  # Пересчёт ходит на OKX за свежим краем свечей, поэтому ему нужен выход в
  # сеть; ограничений по ресурсам не ставим — работа занимает секунды, а не часы.
  risk:
    build: .
    env_file: .env
    profiles: ["tools"]
    depends_on: [postgres]
    command: ["python", "-m", "src.risk_main", "--recompute"]
    restart: "no"

  # Этап 8.8 §7: суточный расчёт исходов по границам (разовая задача,
  # cron 04:10 UTC — после пересчёта целей в 03:40 и до выгрузки в 06:20).
  # Тот же профиль tools и та же причина, что у risk, export и calibration:
  # постоянный контейнер не нужен, а зависимости есть только в образе
  # (правило D-3).
  #   docker compose --profile tools run --rm --no-deps barrier
  #
  # ЭТАП 8.9 §7: этот же сервис несёт расчёт базовых стратегий — нового сервиса
  # не заводится, потому что образ, зависимости и доступ к базе у них одни и те
  # же, а различается только команда:
  #   docker compose --profile tools run --rm --no-deps barrier \
  #       python -m src.baseline_main
  # Расписание базовых стратегий — 04:25 UTC, после исходов системы в 04:10.
  #
  # ЭТАП 8.10 §7: и расчёт подвижного выхода — тоже здесь, по той же причине:
  #   docker compose --profile tools run --rm --no-deps barrier \
  #       python -m src.trailing_main
  # Расписание — 04:40 UTC, после исходов системы (04:10) и линейки (04:25):
  # пары входа берутся из таблицы исходов системы. Код возврата 1 здесь
  # означает в том числе расхождение контрольного варианта с
  # signal_outcomes_barrier — сравнение вариантов тогда недействительно.
  #
  # ГОРЯЧЕГО ПУТИ ЗДЕСЬ НЕТ. Сервисы decision, notify и evaluator этим этапом
  # не изменяются: исход по границам — ВТОРАЯ оценка рядом с действующей, и
  # ни одно решение системы от неё не зависит (§1 ТЗ 8.8).
  #
  # Сеть наружу не нужна: расчёт читает только свои же свечи из public.ohlcv.
  # Сигнал без замороженной цели и исход no_data сбоем НЕ считаются; код 1 —
  # только реальный сбой, и cron его увидит.
  barrier:
    build: .
    env_file: .env
    profiles: ["tools"]
    depends_on: [postgres]
    command: ["python", "-m", "src.barrier_main"]
    restart: "no"

  # ЭТАП 7.4 ЗАКРЫТ И НЕ ВЫПОЛНЯЕТСЯ (решение от 22.08.2026, ТЗ 8.1). Сервис
  # оставлен намеренно: код реплея сохранён, но прогоны не запускаются, а его
  # результаты не поддерживаются. Профиль backtest не поднимается обычным
  # `docker compose up -d`, поэтому на работу продакшна он не влияет.
  #
  # Этап 7.4: исторический реплей ядра. Отдельный профиль — контейнер НЕ
  # поднимается вместе с продакшн-стеком и запускается только вручную:
  #   docker compose --profile backtest run --rm backtest
  # Ресурсы ограничены намеренно (§12.3 ТЗ): продакшн работает на том же
  # сервере и не должен пострадать от прогона.
  # ПЕРЕД ПЕРВЫМ ЗАПУСКОМ создайте файл backtest/.env.backtest на хосте
  # (cp backtest/.env.backtest.example backtest/.env.backtest). Если файла нет,
  # docker создаст на его месте КАТАЛОГ — это и был дефект D-9; лечится только
  # удалением каталога и пересборкой с --no-cache.
  #
  # ПОСЛЕ ЛЮБОГО ИЗМЕНЕНИЯ КОДА пересобирайте образ так:
  #   docker compose --profile backtest build --no-cache \
  #       --build-arg CODE_REV=$(git rev-parse --short HEAD) backtest
  backtest:
    build:
      context: .
      dockerfile: backtest/Dockerfile
      args:
        # Ревизия кода в слое образа: меняется — кэш COPY со старым кодом
        # больше не подхватывается (страховка к правилу --no-cache, D-9).
        CODE_REV: ${CODE_REV:-dev}
    env_file: .env
    profiles: ["backtest"]
    depends_on: [postgres]
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    volumes:
      # Конфигурация прогона и каталог отчётов пробрасываются с хоста: сама
      # конфигурация в образ не запекается, чтобы её можно было править без
      # пересборки.
      - ./backtest/.env.backtest:/app/backtest/.env.backtest:ro
      - ./analysis_out:/opt/agent-trade/analysis_out

volumes:
  pg_data:
  redis_data:
