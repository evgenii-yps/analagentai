name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Пароль обязателен для импорта конфига в тестах.
      POSTGRES_PASSWORD: ci_test_password
      # Настоящий PostgreSQL для тестов SQL свёртки замеров (Этап 9.4, блок D).
      # Без него tests/test_stage_9_4_d.py пропускается.
      PGTEST_HOST: localhost
      PGTEST_PORT: "5432"
      PGTEST_USER: postgres
      PGPASSWORD: ci_test_password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: pytest
